    body {
      background-color: #1c1f23;
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      background-image: url('https://is.gd/bgplaytvapk1');
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, 140px);
      gap: 20px;
      width: 100%;
      max-width: 800px;
      justify-content: center;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .button {
      width: 140px;
      height: 90px;
      background: linear-gradient(to bottom, #f2f2f2, #dedede);
      border-radius: 8px;
      border: 0.8px solid #00aaff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.0);
      transition: box-shadow 0.4s ease, transform 0.3s ease;
      user-select: none;
    }

    .button:active {
      transform: scale(1.06);
      box-shadow: 0px 0px 10px rgba(0, 200, 255, 1.2);
    }

    .button:hover {
      box-shadow: 0px 0px 10px rgba(0, 200, 255, 0.8);
      transform: scale(1.03);
    }

    .logo-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
    }

    .button img {
      max-width: 100%;
      max-height: 100%;      
      object-fit: contain;
      /* "filter: drop-shadow(1px 1px 1px black); */
    }

    .label {
      height: 25px;
      background-color: #1A3A49;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 4px;
      font-size: clamp(10px, 2.5vw, 12px);
      font-weight: bold;
      line-height: 1.1;
      overflow: hidden;
      border-top: 1px solid #00aaff;
      text-transform: uppercase;
      user-select: none;
    }

    @media screen and (max-width: 768px) {
      #ad-container {
        max-width: 100%;
      }

      #ad-container iframe {
        width: 100% !important;
        height: auto !important;
      }
    }
  </style>
